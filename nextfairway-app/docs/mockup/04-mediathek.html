<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>NextFairway App · Mediathek</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@300;400;600&amp;display=swap" rel="stylesheet">
<style>
h2{text-transform:uppercase}
body{margin:0;background:#EDEDEA;font-family:'Barlow',system-ui,sans-serif;color:#111111}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.nf-scroll{scrollbar-width:none}.nf-scroll::-webkit-scrollbar{display:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F5F5F2; overflow: hidden; font-family: 'Barlow', system-ui, sans-serif; color: #111111">
<div class="nf-scroll" style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding: 56px 0 32px">

<header style="display: flex; flex-direction: column; gap: 4px; padding: 0 20px">
<h1 style="margin: 0; font-family: 'Archivo Black', 'Arial Black', sans-serif; letter-spacing: -0.2px; font-size: 30px; font-weight: 700">Mediathek</h1>
<div style="font-size: 14px; color: #5C5C5C">Alle Folgen als Video, dazu Vlogs und Extras vom YouTube-Kanal</div>
</header>

<div class="nf-scroll" style="display: flex; gap: 8px; overflow-x: auto; padding: 0 20px">
<sc-for list="{{chips}}" as="chip" hint-placeholder-count="4">
<button onClick="{{chip.pick}}" aria-pressed="{{chip.active}}" style="{{chip.style}}">{{chip.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 16px; padding: 0 20px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="4">
<a href="03-episode.html" style="display: flex; flex-direction: column; background: #FFFFFF; border-radius: 18px; overflow: hidden; border: 1px solid #E4E4E0">
<div style="{{item.thumbStyle}}">
<div style="width: 50px; height: 50px; border-radius: 25px; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="#111111"><path d="M8 5.5v13l11-6.5z"></path></svg></div>
<div style="position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,0.75); color: #FFFFFF; font-size: 12px; font-weight: 600">{{item.source}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 5px; padding: 14px 16px 16px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: {{accent}}">{{item.kind}}</div>
<div style="font-size: 16px; font-weight: 600; line-height: 1.3">{{item.title}}</div>
</div>
</a>
</sc-for>
</div>
</div>

<nav aria-label="Hauptnavigation" style="flex-shrink: 0; display: flex; justify-content: space-around; padding: 8px 8px 26px; background: #FFFFFF; border-top: 1px solid #DEDED9">
<a href="02-start.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 84px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #666666">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Start</a>
<a href="04-mediathek.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 84px; padding: 6px 0; font-size: 12px; font-weight: 700; color: #111111">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9l5 3-5 3z"></path></svg>Mediathek</a>
<a href="05-community.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 84px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #666666">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Community</a>
<a href="08-mein-profil.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 76px; padding: 6px 0; font-size: 12px; font-weight: 600; color: #666666">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5E17EB","options":["#5E17EB","#111111"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'alle' };
  }
  renderVals() {
    var self = this;
    var filter = this.state.filter;
    var defs = [
      { id: 'alle', label: 'Alle' },
      { id: 'podcast', label: 'Podcast' },
      { id: 'vlog', label: 'Golf-Vlog' },
      { id: 'extra', label: 'Extras' }
    ];
    var chips = defs.map(function (d) {
      var on = d.id === filter;
      return {
        label: d.label,
        active: on ? 'true' : 'false',
        style: 'flex-shrink: 0; min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; ' +
          (on ? 'background: #111111; color: #FFFFFF; border: 1px solid #111111' : 'background: #FFFFFF; color: #111111; border: 1px solid #D6D6D1'),
        pick: function () { self.setState({ filter: d.id }); }
      };
    });
    var all = [
      { type: 'podcast', kind: 'GAST-FOLGE', source: 'Podcast-Folge', title: 'Patrick Limbecker: Warum dein Schwung in der Rotation beginnt', bg: '#111111' },
      { type: 'vlog', kind: 'GOLF-VLOG', source: 'YouTube', title: 'Training, Learnings und Alltag auf dem Weg zurück zu 15,9', bg: '#111111' },
      { type: 'podcast', kind: 'GAST-FOLGE', source: 'Podcast-Folge', title: 'Maxi Pahn über das richtige Fitting', bg: '#1F1F1F' },
      { type: 'extra', kind: 'EXTRA', source: 'YouTube', title: 'KI-Schwunganalyse: Was die Software in meinem Schwung sieht', bg: '#3A3A3A' },
      { type: 'podcast', kind: 'SOLO-UPDATE', source: 'Podcast-Folge', title: 'Mein Golf-Update: [Titel der Solo-Folge]', bg: '#5E17EB' }
    ];
    var items = all.filter(function (i) { return filter === 'alle' || i.type === filter; }).map(function (i) {
      return {
        kind: i.kind, source: i.source, title: i.title,
        thumbStyle: 'position: relative; height: 180px; background: ' + i.bg + '; display: flex; align-items: center; justify-content: center'
      };
    });
    return { accent: this.props.accent ?? '#5E17EB', chips: chips, items: items };
  }
}
</script>
</body>
</html>
